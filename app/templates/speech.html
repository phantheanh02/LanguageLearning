<!DOCTYPE html>
<html>
<head>
    <title>Speech Recognition App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/speech.css') }}">
</head>
<body>
    <a href="{{ url_for('home') }}" class="back-button" style="display: inline-block; margin: 10px; padding: 8px 16px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">← Quay lại</a>
    
    <div class="container">
        <h1>Luyện nói tiếng Nhật</h1>
        {% if error %}
            <p class="error">Error: {{ error }}</p>
        {% endif %}
        <!-- Recording controls -->
        <div class="recorder">
            <div class="image-container" style="text-align: center; margin-bottom: 20px;">
                <img id="recordIcon" src="{{ url_for('static', filename='imgs/' + image) }}" alt="Record" style="width:256px;height:256px;display:block;margin:0 auto 16px;">
                <button id="nextBtn" class="next-button" style="margin-bottom: 16px;">Next Image →</button>
            </div>
            <button id="recordBtn" >Start Recording</button>
            <audio id="playback" controls hidden></audio>
            <p id="recordStatus"></p>
        </div>
        {% if transcription %}
            <div class="transcription-box">
                <h2>Transcription:</h2>
                <p>{{ transcription }}</p>
                {% if language %}
                    <p class="language">Detected language: {{ language }}</p>
                {% endif %}
                <button class="copy-button" onclick="copyToClipboard()">Copy</button>
            </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='js/speech.js') }}"></script>
</body>
</html>
